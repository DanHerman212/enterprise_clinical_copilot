# Build the evaluation-harness image.
#
#   gcloud builds submit --config evaluation/agent/cloudbuild.yaml \
#       --substitutions=_TAG=$(git rev-parse --short HEAD)
#
# The build context is the repository root: the harness imports `services.agent.*` and
# `services.mcp.config`, so a context of `evaluation/` would not build.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=evaluation/agent/Dockerfile
      - --tag=${_IMAGE}:${_TAG}
      - --label=commit=${_TAG}
      - .

images:
  - ${_IMAGE}:${_TAG}

substitutions:
  # Its own repository, not `readmission/`: the agent image and the thing that judges
  # the agent must not be confusable at a glance. The project is written out because
  # `${PROJECT_ID}` inside a substitution default is NOT expanded — a default of
  # `.../${PROJECT_ID}/...` reaches Docker as that literal string and the build fails
  # with "could not parse reference".
  _IMAGE: us-east1-docker.pkg.dev/trim-icon-498815-a0/ecc-eval/harness
  _TAG: manual

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
