# The evaluation pipeline: build and deploy. Nothing here is typed by a person.
#
#   gcloud builds submit --config evaluation/agent/pipeline.yaml \
#       --substitutions=_TAG=$(git rev-parse --short HEAD)
#
# Execution is NOT a build step. It used to be, on the theory that a gate a human
# remembers to run is not a gate — and the theory cost more than it bought: Cloud
# Build is a build service, so an execution nested inside it reports one status line
# for a fourteen-minute job, cannot be watched per patient, and a cancel signal has to
# push through two layers of retry to reach the thing that is actually spending money.
# A build that only builds finishes in the time a build should take and leaves the
# execution somewhere it can be seen, tailed and killed directly:
#
#   gcloud run jobs execute eval-adversarial --region us-east1 --wait
#   gcloud run jobs execute eval-clinical --region us-east1 --update-env-vars "RUN_TAG=..."
#
# Both phases still exit non-zero on a failed gate, so an execution launched by a
# caller that checks the exit code is still gated. Nothing here decides pass/fail;
# the job does 

steps:
  - id: build-harness
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=evaluation/agent/Dockerfile
      - --tag=${_IMAGE}:${_TAG}
      - --label=commit=${_TAG}
      - .

  - id: push-harness
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${_TAG}"]

  # Both jobs are redeployed every pipeline run, from the image this build just
  # produced. A job left pointing at an older image is a gate measuring code that is
  # no longer what would ship.
  #
  # The artifacts bucket is mounted read-only at /mnt/gcs and EVAL_CASES_DIR points at
  # its `fixtures/` prefix, so a case file can be changed by copying an object instead
  # of rebuilding this image. The harness falls back to the copies baked into the
  # image when that prefix is empty, so a fresh bucket evaluates the shipped fixtures
  # rather than collecting nothing.
  #
  # Note that this makes the bucket a second source of truth for `suite2_cases.json`,
  # `adversarial_cases.json` and `cases_82.json`: git stays authoritative, and a run
  # reading a stale object will say so only if you ask which file it opened. Upload the
  # fixture deliberately (`scripts/sync_fixtures.sh`) before a run that depends on it.
  - id: deploy-jobs
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        for PHASE in adversarial clinical; do
          echo "deploying eval-$$PHASE from ${_IMAGE}:${_TAG}"
          gcloud run jobs deploy "eval-$$PHASE" \
            --image "${_IMAGE}:${_TAG}" \
            --region "${_REGION}" \
            --service-account "${_RUNNER_SA}" \
            --set-env-vars "PHASE=$$PHASE,AGENT_URL=${_AGENT_URL},CONCURRENCY=${_CONCURRENCY},PROJECT_ID=${PROJECT_ID},LANGFUSE_HOST=${_LANGFUSE_HOST},EVAL_CASES_DIR=${_FIXTURES_DIR}" \
            --set-secrets "LANGFUSE_PUBLIC_KEY=${_LF_PUBLIC_SECRET}:latest,LANGFUSE_SECRET_KEY=${_LF_SECRET_SECRET}:latest" \
            --add-volume "name=artifacts,type=cloud-storage,bucket=${_ARTIFACTS_BUCKET},readonly=true" \
            --add-volume-mount "volume=artifacts,mount-path=${_ARTIFACTS_MOUNT}" \
            --max-retries 0 \
            --task-timeout "${_TASK_TIMEOUT}" \
            --memory 1Gi --cpu 1 --tasks 1 \
            --quiet
        done

substitutions:
  _IMAGE: us-east1-docker.pkg.dev/trim-icon-498815-a0/ecc-eval/harness
  _TAG: manual
  _REGION: us-east1
  # Case fixtures live outside the image (see the deploy-jobs comment above).
  _ARTIFACTS_BUCKET: ecc-eval-artifacts
  _ARTIFACTS_MOUNT: /mnt/gcs
  _FIXTURES_DIR: /mnt/gcs/fixtures
  _AGENT_URL: https://agent-jamycsjjzq-ue.a.run.app
  _RUNNER_SA: ecc-eval-runner@trim-icon-498815-a0.iam.gserviceaccount.com
  _CONCURRENCY: "4"
  _TASK_TIMEOUT: "3600"
  # Score attachment: the judge writes its verdicts onto the trace each answer
  # produced. Reusing the agent's own secrets rather than a second copy means one
  # rotation, and the host is an env var because only the keys are secret.
  _LANGFUSE_HOST: https://observability.danielmherman.com
  _LF_PUBLIC_SECRET: langfuse-project-public-key
  _LF_SECRET_SECRET: langfuse-project-secret-key

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

# A build of the harness image plus two job deploys. The old value was sized for two
# gated executions; nothing in this file waits on a run any more.
timeout: 3600s
