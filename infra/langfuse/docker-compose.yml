# Langfuse's data plane — the three stateful components, on one VM.
#
# Langfuse splits into a stateless half (web + worker, deployed as Cloud Run
# services in `deploy.sh`) and this half: ClickHouse as the event store, Redis as
# the queue and cache, and S3-compatible blob storage for event uploads and
# media. The split is not a preference — Cloud Run cannot host a stateful
# database with a local disk, and ClickHouse is where traces actually live.
#
# Postgres is deliberately NOT here: Langfuse's transactional data goes to a
# dedicated `langfuse` database on the existing Cloud SQL instance, so the
# observability store's backups and availability are the managed ones, and its
# credentials are its own rather than the website's.
#
# Ports are remapped away from the reference compose because ClickHouse's native
# port and MinIO's S3 API both default to 9000. Silently having one shadow the
# other is the kind of failure that looks like data loss.
#
#   ClickHouse  http  8123    native 9000 (internal only)
#   Redis             6379
#   MinIO       s3    9100    console 9101
#
# Nothing here is published beyond the VM's own network interface: the Cloud Run
# services reach these over the VPC (Direct VPC egress), and no firewall rule
# admits them from the internet. The compose file binds on 0.0.0.0 only because
# the container's network namespace is the VM's; the protection is the firewall,
# which `deploy.sh` creates.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # `wget --spider` rather than curl: the ClickHouse image has no curl.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: langfuse-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_AUTH:?REDIS_AUTH is required}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_AUTH: ${REDIS_AUTH}

  minio:
    # Chainguard's MinIO, as in Langfuse's reference compose: a minimal image
    # with no shell or package manager to inherit a CVE from.
    image: cgr.dev/chainguard/minio:latest
    container_name: langfuse-minio
    restart: unless-stopped
    command: server /data --address ":9100" --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    ports:
      - "9100:9100"
      - "9101:9101"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  cloud-sql-proxy:
    # Cloud SQL Auth Proxy, so the worker can reach the managed Postgres without
    # the database being exposed: the proxy opens an outbound authenticated
    # connection and serves it on this compose network. The VM's service account
    # needs roles/cloudsql.client on the instance and a cloud-platform scope —
    # a VM created with the default scopes cannot mint the token, and the proxy
    # fails with a scope error that reads like a permissions error.
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    container_name: langfuse-cloud-sql-proxy
    restart: unless-stopped
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "trim-icon-498815-a0:us-east1:danielmherman-db"

  worker:
    # The worker runs HERE, not on Cloud Run, and that is a fix for a real failure
    # rather than a preference. On Cloud Run it could not keep its BullMQ blocking
    # connections to Redis alive: every long-lived idle connection across the
    # Cloud Run egress boundary timed out after exactly 30s (`Socket timeout.
    # Expecting data, but didn't receive any in 30000ms`), so the queue never
    # drained and no trace ever reached ClickHouse. The web service was
    # unaffected — its Redis use is short commands, and its ingestion POSTs
    # returned 200 — so events were accepted and then sat in a queue nothing
    # could consume. Beside Redis the worker is also simply less to run: it is a
    # consumer with no need for a public hostname.
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on:
      - redis
      - clickhouse
      - minio
      - cloud-sql-proxy
    environment:
      NODE_ENV: production
      TELEMETRY_ENABLED: "false"
      DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required}
      SALT: ${SALT:?SALT is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH:?REDIS_AUTH is required}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9100
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9100
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      # The worker's HTTP health endpoint, for a local check. Not published beyond
      # the VM's interface: the firewall admits nothing here from outside the subnet.
      - "3030:3030"

volumes:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
  minio-data:
