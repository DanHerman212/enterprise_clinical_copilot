# Cloud Build config for the readmission CPR serving image.
#
# Invoked by scripts/deploy_cpr.py only when the CPR source hash changes.
# Cloud Build workers are linux/amd64, so this avoids the Apple-Silicon arm64
# cross-build trap entirely. The image is tagged with a content hash (_TAG) and
# also with `latest` for the provenance record in register_model.
#
# _IMAGE has no default (no project id is committed); deploy_cpr.py always
# passes it via --substitutions.
# _IMAGE and _TAG have NO defaults (ECC-61): a build submitted without
# --substitutions fails loudly instead of silently tagging the mutable
# `latest`. deploy_cpr.py always passes the content-hash _TAG. (A
# `substitutions:` block is deliberately omitted — Cloud Build requires any
# referenced substitution to carry a value.)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:${_TAG}
      - -t
      - ${_IMAGE}:latest
      - -f
      - Dockerfile
      - .

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest
