# Cloud Build — build and push the training image to Artifact Registry.
# Build context is `mlops/`, so the Dockerfile is at training/Dockerfile and the
# whole package is copied into the image.
# Usage: bash mlops/training/build_images.sh
#    or: gcloud builds submit mlops --config mlops/training/cloudbuild.yaml

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/readmission/training:${BUILD_ID}
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/readmission/training:latest
      - -f
      - training/Dockerfile
      - .

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/readmission/training:${BUILD_ID}
  - us-east1-docker.pkg.dev/$PROJECT_ID/readmission/training:latest

options:
  logging: CLOUD_LOGGING_ONLY
