# Builds AND deploys the MCP server so the runtime configuration is codified
# here rather than living only in console state (a service recreated from this
# repo comes up correctly configured). The Cloud Build service account needs
# roles/run.admin and roles/iam.serviceAccountUser on the runtime SA.
#
# `gcloud builds submit --tag` requires the Dockerfile at the context root, but
# the mcp-server's context must be the harness root (it needs both mcp_server/
# and the pure-stdlib rag/ package that rag_search.py imports), while
# mcp_server/Dockerfile owns that root. This config builds it with -f.
#
# Usage:
#   gcloud builds submit --config projects/agent-harness/cloudbuild.mcp.yaml \
#     --substitutions _IMAGE=us-east1-docker.pkg.dev/<PROJECT>/readmission/mcp-server:latest \
#     projects/agent-harness
substitutions:
  _REGION: us-east1

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "mcp_server/Dockerfile", "-t", "${_IMAGE}", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  # config.py is fail-closed (no default project), so PROJECT_ID must be set
  # here. Use the ^@^ delimiter and a single --set-env-vars: repeating the flag
  # does not accumulate — the last occurrence silently replaces the rest.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mcp-server
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --no-allow-unauthenticated
      - --service-account=mcp-server-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=^@^PROJECT_ID=$PROJECT_ID@LOCATION=${_REGION}@FEATURE_SOURCE=bigquery
      - --min-instances=0
      - --max-instances=3
      - --memory=512Mi

images: ["${_IMAGE}"]

options:
  logging: CLOUD_LOGGING_ONLY
