              taskOutputArtifact:
                outputArtifactKey: x_train
                producerTask: load-data
            x_val:
              taskOutputArtifact:
                outputArtifactKey: x_val
                producerTask: load-data
          parameters:
            max_drifted_share:
              componentInputParameter: max_drifted_share
        taskInfo:
          name: validate-data
  inputDefinitions:
