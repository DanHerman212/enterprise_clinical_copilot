deploymentSpec:
  executors:
    exec-benchmark-gate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - benchmark_gate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef benchmark_gate(\n    benchmark_aucpr: float,\n    hospital_aucpr:\
          \ float,\n) -> NamedTuple(\"GateOutputs\", [(\"passed\", bool)]):\n    \"\
          \"\"KFP component: gate on benchmark > HOSPITAL.\"\"\"\n    from pipelines.components.benchmark_gate\
          \ import run_benchmark_gate\n\n    passed = run_benchmark_gate(\n      \
          \  benchmark_aucpr=benchmark_aucpr, hospital_aucpr=hospital_aucpr,\n   \
          \ )\n    return (passed,)\n\n"
        image: us-docker.pkg.dev/vertex-ai/training/xgboost-cpu.2-1:latest
    exec-benchmark-xgboost:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - benchmark_xgboost
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'xgboost' 'scikit-learn'\
          \ 'pandas' 'pyarrow' 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef benchmark_xgboost(\n    x_train: dsl.Input[dsl.Dataset],\n  \
          \  y_train: dsl.Input[dsl.Dataset],\n    x_val: dsl.Input[dsl.Dataset],\n\
          \    y_val: dsl.Input[dsl.Dataset],\n    xgb_params: dict,\n    cat_features:\
          \ list,\n    model_artifact: dsl.Output[dsl.Model],\n) -> float:\n    \"\
          \"\"KFP component: train benchmark XGBoost.\"\"\"\n    from pipelines.components.benchmark_xgboost\
          \ import run_benchmark_xgboost\n\n    return run_benchmark_xgboost(\n  \
          \      x_train_path=x_train.path, y_train_path=y_train.path,\n        x_val_path=x_val.path,\
          \ y_val_path=y_val.path,\n        xgb_params=xgb_params, cat_features=cat_features,\n\
          \        model_artifact_path=model_artifact.path,\n    )\n\n"
        image: us-docker.pkg.dev/vertex-ai/training/xgboost-cpu.2-1:latest
    exec-calibrate-threshold:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - calibrate_threshold
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'xgboost' 'scikit-learn'\
          \ 'pandas' 'pyarrow' 'google-cloud-aiplatform'  &&  python3 -m pip install\
          \ --quiet --no-warn-script-location 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef calibrate_threshold(\n    x_train: dsl.Input[dsl.Dataset],\n\
          \    y_train: dsl.Input[dsl.Dataset],\n    groups: dsl.Input[dsl.Dataset],\n\
          \    best_params: dsl.Input[dsl.Artifact],\n    cat_features: list,\n  \
          \  beta: float,\n    threshold_curve: dsl.Output[dsl.Artifact],\n    threshold_plot:\
          \ dsl.Output[dsl.HTML],\n    metrics: dsl.Output[dsl.Metrics],\n    project_id:\
          \ str = \"\",\n    location: str = \"us-east1\",\n    experiment_name: str\
          \ = \"\",\n    pipeline_job_name: str = \"\",\n) -> float:\n    \"\"\"KFP\
          \ component: select the operating threshold via OOF F-beta.\"\"\"\n    import\
          \ json\n\n    from pipelines.components.calibrate_threshold import (\n \
          \       _build_threshold_html, run_calibrate_threshold,\n    )\n    from\
          \ pipelines.components._experiment import (\n        companion_run, safe_log_metrics,\
          \ safe_log_params,\n    )\n\n    threshold = run_calibrate_threshold(\n\
          \        x_train_path=x_train.path,\n        y_train_path=y_train.path,\n\
          \        groups_path=groups.path,\n        best_params_path=best_params.path,\n\
          \        cat_features=cat_features,\n        beta=beta,\n        threshold_output_path=threshold_curve.path,\n\
          \    )\n\n    with open(threshold_curve.path) as f:\n        record = json.load(f)\n\
          \n    # Threshold-selection sweep plot (precision/recall/F-beta vs threshold\
          \ with\n    # the selected point + sweet-spot plateau band) as a rendered\
          \ HTML report.\n    with open(threshold_plot.path, \"w\") as f:\n      \
          \  f.write(_build_threshold_html(record))\n\n    # dsl.Metrics on the PipelineRun:\
          \ genuine measured quantities only (config\n    # and hyperparameters go\
          \ to the companion run's Parameters UI instead, so\n    # this tab stays\
          \ a clean list of *metrics*).\n    metrics.log_metric(\"tuned_threshold\"\
          , record[\"threshold\"])\n    metrics.log_metric(\"fbeta_at_threshold\"\
          , record[\"fbeta\"])\n    metrics.log_metric(\"train_prevalence\", record[\"\
          prevalence\"])\n\n    # Companion Experiment run: clean params-vs-metrics\
          \ separation + Charts.\n    with companion_run(\n        project_id=project_id,\
          \ location=location,\n        experiment=experiment_name, pipeline_job_name=pipeline_job_name,\n\
          \    ) as ap:\n        safe_log_params(ap, {\n            \"fbeta_beta\"\
          : record[\"beta\"],\n            \"threshold_selection\": record[\"selection\"\
          ],\n            \"train_rows\": record[\"n_train\"],\n            \"train_prevalence\"\
          : record[\"prevalence\"],\n        })\n        safe_log_metrics(ap, {\n\
          \            \"tuned_threshold\": record[\"threshold\"],\n            \"\
          fbeta_at_threshold\": record[\"fbeta\"],\n        })\n\n    return threshold\n\
          \n"
        image: us-docker.pkg.dev/vertex-ai/training/xgboost-cpu.2-1:latest
    exec-evaluate-test:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_test
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_test(\n    x_test: dsl.Input[dsl.Dataset],\n    y_test:\
          \ dsl.Input[dsl.Dataset],\n    model_artifact: dsl.Input[dsl.Model],\n \
          \   tuned_threshold: float,\n    hpo_val_aucpr: float,\n    benchmark_aucpr:\
          \ float,\n    hospital_aucpr: float,\n    metrics: dsl.Output[dsl.Metrics],\n\
          \    classification_metrics: dsl.Output[dsl.ClassificationMetrics],\n  \
          \  eval_report: dsl.Output[dsl.HTML],\n    beta: float = 2.0,\n    project_id:\
          \ str = \"\",\n    location: str = \"us-east1\",\n    experiment_name: str\
          \ = \"\",\n    pipeline_job_name: str = \"\",\n) -> NamedTuple(\n    \"\
          TestOutputs\",\n    [(\"test_aucpr\", float), (\"beat_hospital\", bool),\
          \ (\"stable\", bool)],\n):\n    \"\"\"KFP component: evaluate model on held-out\
          \ test set at the tuned threshold.\"\"\"\n    from pipelines.components.evaluate_test\
          \ import _build_eval_html, run_evaluate_test\n    from pipelines.components._experiment\
          \ import (\n        companion_run, safe_log_metrics, safe_log_params,\n\
          \    )\n\n    result = run_evaluate_test(\n        x_test_path=x_test.path,\
          \ y_test_path=y_test.path,\n        model_artifact_path=model_artifact.path,\n\
