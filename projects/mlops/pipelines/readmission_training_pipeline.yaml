          \ cat_features=cat_features,\n        model_artifact_path=model_artifact.path,\n\
          \    )\n\n"
        image: us-docker.pkg.dev/vertex-ai/training/xgboost-cpu.2-1:latest
    exec-validate-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - validate_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'evidently==0.4.34'\
          \ 'numpy<2' 'pandas' 'pyarrow'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef validate_data(\n    x_train: dsl.Input[dsl.Dataset],\n    x_val:\
          \ dsl.Input[dsl.Dataset],\n    max_drifted_share: float,\n    drift_html:\
          \ dsl.Output[dsl.HTML],\n    quality_html: dsl.Output[dsl.HTML],\n    fail_on_drift:\
          \ bool = True,\n) -> bool:\n    \"\"\"KFP component: Evidently AI data validation\
          \ gate (hard-fail on drift).\"\"\"\n    from pipelines.components.validate_data\
          \ import run_validate_data\n\n    return run_validate_data(\n        x_train_path=x_train.path,\
          \ x_val_path=x_val.path,\n        drift_report_html=drift_html.path,\n \
          \       quality_report_html=quality_html.path,\n        max_drifted_share=max_drifted_share,\n\
          \        fail_on_drift=fail_on_drift,\n    )\n\n"
        image: us-docker.pkg.dev/vertex-ai/training/xgboost-cpu.2-1:latest
pipelineInfo:
  description: "30-day readmission risk: impute \u2192 validate \u2192 benchmark \u2192\
    \ HPO \u2192 train \u2192 evaluate/explain/audit \u2192 register."
  name: readmission-training
root:
  dag:
    tasks:
      benchmark-gate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-benchmark-gate
        dependentTasks:
        - benchmark-xgboost
        inputs:
          parameters:
            benchmark_aucpr:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: benchmark-xgboost
            hospital_aucpr:
              componentInputParameter: hospital_aucpr
        taskInfo:
          name: benchmark-gate
      benchmark-xgboost:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-benchmark-xgboost
        dependentTasks:
        - load-data
        - validate-data
        inputs:
          artifacts:
            x_train:
              taskOutputArtifact:
                outputArtifactKey: x_train
                producerTask: load-data
            x_val:
              taskOutputArtifact:
                outputArtifactKey: x_val
                producerTask: load-data
            y_train:
              taskOutputArtifact:
                outputArtifactKey: y_train
                producerTask: load-data
            y_val:
              taskOutputArtifact:
                outputArtifactKey: y_val
                producerTask: load-data
          parameters:
            cat_features:
              componentInputParameter: cat_features
            xgb_params:
              componentInputParameter: xgb_params
        taskInfo:
          name: benchmark-xgboost
      calibrate-threshold:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-calibrate-threshold
        dependentTasks:
        - load-data
        - optuna-hpo
        inputs:
          artifacts:
            best_params:
              taskOutputArtifact:
                outputArtifactKey: best_params
                producerTask: optuna-hpo
            groups:
              taskOutputArtifact:
                outputArtifactKey: groups_train
                producerTask: load-data
            x_train:
              taskOutputArtifact:
                outputArtifactKey: x_train
                producerTask: load-data
            y_train:
              taskOutputArtifact:
                outputArtifactKey: y_train
                producerTask: load-data
          parameters:
            beta:
              componentInputParameter: fbeta_beta
            cat_features:
              componentInputParameter: cat_features
            experiment_name:
              runtimeValue:
                constant: readmission-mlops
            pipeline_job_name:
              runtimeValue:
                constant: '{{$.pipeline_job_name}}'
            project_id:
              componentInputParameter: project_id
        taskInfo:
          name: calibrate-threshold
      evaluate-test:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-test
        dependentTasks:
        - benchmark-xgboost
        - calibrate-threshold
        - load-data
        - optuna-hpo
        - train-final
        inputs:
          artifacts:
            model_artifact:
              taskOutputArtifact:
                outputArtifactKey: model_artifact
                producerTask: train-final
            x_test:
              taskOutputArtifact:
                outputArtifactKey: x_test
                producerTask: load-data
            y_test:
              taskOutputArtifact:
                outputArtifactKey: y_test
                producerTask: load-data
          parameters:
            benchmark_aucpr:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: benchmark-xgboost
            beta:
              componentInputParameter: fbeta_beta
            experiment_name:
              runtimeValue:
                constant: readmission-mlops
            hospital_aucpr:
              componentInputParameter: hospital_aucpr
            hpo_val_aucpr:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: optuna-hpo
            pipeline_job_name:
              runtimeValue:
                constant: '{{$.pipeline_job_name}}'
            project_id:
              componentInputParameter: project_id
            tuned_threshold:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: calibrate-threshold
        taskInfo:
          name: evaluate-test
      fairness-audit:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-fairness-audit
        dependentTasks:
        - calibrate-threshold
        - load-data
        - train-final
        inputs:
          artifacts:
            model_artifact:
              taskOutputArtifact:
                outputArtifactKey: model_artifact
                producerTask: train-final
            x_test:
              taskOutputArtifact:
                outputArtifactKey: x_test
                producerTask: load-data
            y_test:
              taskOutputArtifact:
                outputArtifactKey: y_test
                producerTask: load-data
          parameters:
            experiment_name:
              runtimeValue:
                constant: readmission-mlops
            pipeline_job_name:
              runtimeValue:
                constant: '{{$.pipeline_job_name}}'
            project_id:
              componentInputParameter: project_id
            tuned_threshold:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: calibrate-threshold
        taskInfo:
          name: fairness-audit
      fit-imputer-op:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-fit-imputer-op
        inputs:
          parameters:
            full_table_ref:
              componentInputParameter: full_table_ref
            project_id:
              componentInputParameter: project_id
            split_col:
              componentInputParameter: split_col
            train_split:
              componentInputParameter: train_split
        taskInfo:
          name: fit-imputer-op
      load-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-data
        dependentTasks:
        - fit-imputer-op
        inputs:
          artifacts:
            imputer:
              taskOutputArtifact:
                outputArtifactKey: imputer
                producerTask: fit-imputer-op
          parameters:
            cat_features:
              componentInputParameter: cat_features
            full_table_ref:
              componentInputParameter: full_table_ref
            label_col:
              componentInputParameter: label_col
            project_id:
              componentInputParameter: project_id
            selected_features:
              componentInputParameter: selected_features
            split_col:
              componentInputParameter: split_col
            test_split:
              componentInputParameter: test_split
            train_split:
              componentInputParameter: train_split
            val_split:
              componentInputParameter: val_split
        taskInfo:
          name: load-data
      optuna-hpo:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-optuna-hpo
        dependentTasks:
        - benchmark-gate
        - load-data
        inputs:
          artifacts:
            groups:
              taskOutputArtifact:
                outputArtifactKey: groups_train
                producerTask: load-data
            x_train:
              taskOutputArtifact:
                outputArtifactKey: x_train
                producerTask: load-data
            y_train:
              taskOutputArtifact:
                outputArtifactKey: y_train
                producerTask: load-data
          parameters:
            cat_features:
              componentInputParameter: cat_features
            experiment_name:
              runtimeValue:
                constant: readmission-mlops
            n_trials:
              componentInputParameter: n_trials
            pipeline_job_name:
              runtimeValue:
                constant: '{{$.pipeline_job_name}}'
            project_id:
              componentInputParameter: project_id
        taskInfo:
          name: optuna-hpo
      register-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-register-model
        dependentTasks:
        - benchmark-xgboost
        - calibrate-threshold
        - evaluate-test
        - fit-imputer-op
        - load-data
        - optuna-hpo
        - train-final
        inputs:
          artifacts:
            imputer:
              taskOutputArtifact:
                outputArtifactKey: imputer
                producerTask: fit-imputer-op
            model_artifact:
              taskOutputArtifact:
                outputArtifactKey: model_artifact
                producerTask: train-final
            schema:
              taskOutputArtifact:
                outputArtifactKey: schema
                producerTask: load-data
          parameters:
            benchmark_aucpr:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: benchmark-xgboost
            beta:
              componentInputParameter: fbeta_beta
            hpo_val_aucpr:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: optuna-hpo
            project_id:
              componentInputParameter: project_id
            serving_container_image_uri:
              componentInputParameter: serving_container_image_uri
            test_aucpr:
              taskOutputParameter:
                outputParameterKey: test_aucpr
                producerTask: evaluate-test
            tuned_threshold:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: calibrate-threshold
        taskInfo:
          name: register-model
      shap-explain:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-shap-explain
        dependentTasks:
        - load-data
        - train-final
        inputs:
          artifacts:
            model_artifact_path:
              taskOutputArtifact:
                outputArtifactKey: model_artifact
                producerTask: train-final
            x_test_path:
              taskOutputArtifact:
                outputArtifactKey: x_test
                producerTask: load-data
        taskInfo:
          name: shap-explain
      train-final:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-final
        dependentTasks:
        - load-data
        - optuna-hpo
        inputs:
          artifacts:
            best_params:
              taskOutputArtifact:
                outputArtifactKey: best_params
                producerTask: optuna-hpo
            x_train:
              taskOutputArtifact:
                outputArtifactKey: x_train
                producerTask: load-data
            x_val:
              taskOutputArtifact:
                outputArtifactKey: x_val
                producerTask: load-data
            y_train:
              taskOutputArtifact:
                outputArtifactKey: y_train
                producerTask: load-data
            y_val:
              taskOutputArtifact:
                outputArtifactKey: y_val
                producerTask: load-data
          parameters:
            cat_features:
              componentInputParameter: cat_features
        taskInfo:
          name: train-final
      validate-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-validate-data
        dependentTasks:
