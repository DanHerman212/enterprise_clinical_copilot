          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef fairness_audit(\n    x_test: dsl.Input[dsl.Dataset],\n    y_test:\
          \ dsl.Input[dsl.Dataset],\n    model_artifact: dsl.Input[dsl.Model],\n \
          \   tuned_threshold: float,\n    fairness_html: dsl.Output[dsl.HTML],\n\
          \    max_tpr_gap: float = 0.15,\n    max_fpr_gap: float = 0.15,\n    project_id:\
          \ str = \"\",\n    location: str = \"us-east1\",\n    experiment_name: str\
          \ = \"\",\n    pipeline_job_name: str = \"\",\n) -> NamedTuple(\n    \"\
          FairnessOutputs\",\n    [(\"equal_opportunity_pass\", bool), (\"predictive_equality_pass\"\
          , bool)],\n):\n    \"\"\"KFP component: subgroup error-rate parity audit\
          \ at the tuned threshold.\"\"\"\n    import os\n\n    from pipelines.components.fairness_audit\
          \ import run_fairness_audit\n    from pipelines.components._experiment import\
          \ companion_run, safe_log_metrics\n\n    report_json = os.path.join(os.path.dirname(fairness_html.path),\
          \ \"report.json\")\n    report = run_fairness_audit(\n        x_test_path=x_test.path,\n\
          \        y_test_path=y_test.path,\n        model_artifact_path=model_artifact.path,\n\
          \        fairness_report_json=report_json,\n        fairness_html_path=fairness_html.path,\n\
          \        tuned_threshold=tuned_threshold,\n        max_tpr_gap=max_tpr_gap,\n\
          \        max_fpr_gap=max_fpr_gap,\n    )\n\n    # Surface the parity gaps\
          \ to the experiment UI (diagnostic; never gates).\n    flat: dict[str, float]\
          \ = {}\n    for name, g in report.get(\"gaps\", {}).items():\n        if\
          \ g.get(\"tpr_gap\") is not None:\n            flat[f\"fairness_tpr_gap_{name}\"\
          ] = g[\"tpr_gap\"]\n        if g.get(\"fpr_gap\") is not None:\n       \
          \     flat[f\"fairness_fpr_gap_{name}\"] = g[\"fpr_gap\"]\n    tpr_gaps\
          \ = [v for k, v in flat.items() if k.startswith(\"fairness_tpr_gap_\")]\n\
          \    fpr_gaps = [v for k, v in flat.items() if k.startswith(\"fairness_fpr_gap_\"\
          )]\n    if tpr_gaps:\n        flat[\"fairness_max_tpr_gap\"] = max(tpr_gaps)\n\
          \    if fpr_gaps:\n        flat[\"fairness_max_fpr_gap\"] = max(fpr_gaps)\n\
          \n    with companion_run(\n        project_id=project_id, location=location,\n\
          \        experiment=experiment_name, pipeline_job_name=pipeline_job_name,\n\
          \    ) as ap:\n        safe_log_metrics(ap, flat)\n\n    return (report[\"\
          equal_opportunity_pass\"], report[\"predictive_equality_pass\"])\n\n"
