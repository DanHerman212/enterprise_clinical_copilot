# PIPELINE DEFINITION
# Name: readmission-training
# Description: 30-day readmission risk: impute → validate → benchmark → HPO → train → evaluate/explain/audit → register.
# Inputs:
#    cat_features: list [Default: ['gender', 'race', 'admission_type', 'discharge_location', 'insurance', 'has_procedure', 'oncology_flag']]
#    fbeta_beta: float [Default: 2.0]
#    full_table_ref: str
#    hospital_aucpr: float [Default: 0.33246509478494324]
#    label_col: str [Default: 'readmission_30d']
#    max_drifted_share: float [Default: 0.2]
#    n_trials: int [Default: 50.0]
#    project_id: str
#    selected_features: list [Default: ['age', 'gender', 'race', 'admission_type', 'discharge_location', 'insurance', 'prior_admission_count', 'prior_inpatient_days', 'recent_ed_visits', 'index_los_days', 'procedure_count', 'has_procedure', 'medication_count', 'medication_order_count', 'rbc_last', 'rbc_min', 'rdw_max', 'monocytes_min', 'hemoglobin_min', 'sodium_last', 'sodium_max', 'sodium_min', 'oncology_flag']]
#    serving_container_image_uri: str [Default: '']
#    split_col: str [Default: 'split_name']
#    test_split: str [Default: 'test']
#    train_split: str [Default: 'train']
#    val_split: str [Default: 'validation']
#    xgb_params: dict [Default: {'subsample': 0.8, 'max_depth': 6.0, 'learning_rate': 0.05, 'colsample_bytree': 0.8, 'n_estimators': 300.0, 'random_state': 42.0}]
