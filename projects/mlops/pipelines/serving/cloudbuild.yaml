# Cloud Build — build and push the custom serving image to Artifact Registry.
# Usage (context = projects/mlops):
#   gcloud builds submit --config pipelines/serving/cloudbuild.yaml projects/mlops
#
# Pass the resulting image URI to the pipeline as `serving_container_image_uri`
# (or via the SERVING_IMAGE_URI env var used by training_pipeline.submit()).

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/readmission/serving:${BUILD_ID}
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/readmission/serving:latest
      - -f
      - pipelines/serving/Dockerfile
      - .

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/readmission/serving:${BUILD_ID}
  - us-east1-docker.pkg.dev/$PROJECT_ID/readmission/serving:latest

options:
  logging: CLOUD_LOGGING_ONLY
