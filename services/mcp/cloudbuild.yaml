# Builds AND deploys the MCP server so the runtime configuration is codified
# here rather than living only in console state (a service recreated from this
# repo comes up correctly configured). The Cloud Build service account needs
# roles/run.admin and roles/iam.serviceAccountUser on the runtime SA.
#
# `gcloud builds submit --tag` requires the Dockerfile at the context root, but
# the MCP service context is the repository root and contains the service and
# retrieval packages. This config builds the service Dockerfile with -f.
#
# Usage:
#   gcloud builds submit --config services/mcp/cloudbuild.yaml \
#     --substitutions _IMAGE=us-east1-docker.pkg.dev/<PROJECT>/readmission/mcp-server:latest \
#     .
substitutions:
  _REGION: us-east1
  # A default, so a push trigger can run this with no substitutions passed. The
  # usage above still works: --substitutions overrides it.
  #
  # The project id is a literal, and has to be: Cloud Build does not expand built-ins
  # inside a user substitution default, so `$PROJECT_ID` here would become that literal
  # string and the build would fail with `invalid image name ".../$PROJECT_ID/..."`.
  # The agent's config carries the same note from the same discovery (2026-09-15).
  #
  # `:latest` rather than a commit sha, matching services/agent/cloudbuild.yaml. The
  # website tags by commit and can therefore name the revision behind a deployed image;
  # these two cannot, because a built-in is not expandable here. That is a provenance
  # gap worth closing — but by fixing all three configs together, not by making this
  # one differ from the other two.
  _IMAGE: us-east1-docker.pkg.dev/trim-icon-498815-a0/readmission/mcp-server:latest

# Dedicated build service account (ECC-58): builds must not run as the project
# default SA. cicd-deployer needs roles/run.admin, roles/iam.serviceAccountUser
# on mcp-server-sa, roles/artifactregistry.writer, roles/logging.logWriter, and
# roles/storage.objectViewer on the Cloud Build source bucket (the build SA
# reads its own uploaded source; missing it fails as INVALID_ARGUMENT/403).
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/cicd-deployer@$PROJECT_ID.iam.gserviceaccount.com'

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "services/mcp/Dockerfile", "-t", "${_IMAGE}", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  # config.py is fail-closed (no default project), so PROJECT_ID must be set
  # here. Use the ^@^ delimiter and a single --set-env-vars: repeating the flag
  # does not accumulate — the last occurrence silently replaces the rest.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mcp-server
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --no-allow-unauthenticated
      - --service-account=mcp-server-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=^@^PROJECT_ID=$PROJECT_ID@LOCATION=${_REGION}@FEATURE_SOURCE=bigquery
      # PubMed literature search. Both of these are secrets, and the contact address
      # is one for a repository reason rather than a security one: it is a personal
      # email, this repo's visibility is not ours to assume, and the address travels
      # in clear to NCBI on every request regardless. The point is not to hide it,
      # it is not to publish it. Keeping it here also sidesteps the delimiter trap on
      # the line above, where `@` separates values and an email address contains one.
      #
      # `--set-secrets` REPLACES the whole set, exactly as `--set-env-vars` does —
      # a second flag would silently drop this one rather than add to it. Every
      # secret this service has is listed on this one line. The runtime SA needs
      # roles/secretmanager.secretAccessor on both; granted 2026-10-08 to
      # mcp-server-sa@.
      - --set-secrets=^@^NCBI_EMAIL=ncbi-email:latest@NCBI_API_KEY=ncbi-api-key:latest
      # min-instances 0, restored 2026-09-18 after the demo window closed. Set
      # to 1 for the live end-to-end test: this service's cold start is the
      # largest single component of a first call — 18.4s measured cold against
      # 0.076s warm — because its start is import-bound (google-cloud-aiplatform
      # and its pandas/pyarrow/IPython tree). The measurement stands; the warm
      # instance was for a test, and the default stays scale-to-zero.
      - --min-instances=0
      - --max-instances=3
      - --memory=512Mi

images: ["${_IMAGE}"]

options:
  logging: CLOUD_LOGGING_ONLY
