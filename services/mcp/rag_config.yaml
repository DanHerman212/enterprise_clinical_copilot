# rag_config.yaml — config-as-code for the RAG pipeline.
#
# Corpus, chunking, index, eval, and deploy settings live here so the corpus
# switch (MIMIC benchmark vs MTSamples demo) is ONE value, not a scatter of env
# vars across scripts. Env overrides: PROJECT_ID, RAG_CORPUS.
#
# The embedding parameters are deliberately NOT here: model, dimensions and task
# types decide which vector space the index was built in, and they would return
# plausible-but-wrong neighbours if the build and the serving path ever
# disagreed. They are defined once, in retrieval/embed.py, and this file's
# loader imports them from there. RagConfig.load() raises if an `embedding:`
# block reappears here — deleting it was the fix, not copying it back.
#
# The section whitelist is deliberately NOT duplicated here either — it stays
# single-sourced in rag/chunking.INDEX_SECTIONS (validated against
# rag/sections.KNOWN_HEADINGS), so build and serving can never drift (ECC-33).

corpus:
  active: mimic            # "mimic" | "demo"
  project: "trim-icon-498815-a0"
  location: "us-east1"
  mimic:
    notes_table_ref: "trim-icon-498815-a0.mimiciv_note.discharge"
    split_table_ref: "trim-icon-498815-a0.readmission.analytics_dataset_encoded"
    split_name: "test"
    expected_vectors: 555770
    shard_size: "SHARD_SIZE_MEDIUM"
    deploy_machine_type: "e2-standard-16"
  demo:
    notes_table_ref: "trim-icon-498815-a0.readmission.hybrid_notes"
    split_table_ref: "trim-icon-498815-a0.readmission.hybrid_split"
    split_name: "test"
    # 89 MTSamples notes -> 454 section chunks (deterministic, recomputed
    # locally with the same chunk_note(pack_to=700) path the pipeline runs).
    expected_vectors: 454
    shard_size: "SHARD_SIZE_SMALL"
    deploy_machine_type: "e2-standard-2"

chunking:
  pack_to: 700
  max_chars: 1500

index:
  approximate_neighbors: 40
  brute_sample: 2000
  chunk_cpu: "2"
  chunk_mem: "8Gi"
  embed_cpu: "8"
  embed_mem: "24Gi"
  index_cpu: "2"
  index_mem: "8Gi"

eval:
  num_queries: 100
  top_k: 10
  seed: 42
  recall_at_10_min: 0.90
  empty_result_rate_max: 0.05

deploy:
  endpoint_name: "readmission-rag-index"
